name: Daily sheep fact

on:
  schedule:
    # GitHub schedules are in UTC and ignore daylight saving time, so run at
    # both 14:00 and 15:00 UTC. The first step only lets the run that lands
    # at 10am New York time through.
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Only send at 10am Eastern
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "10" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.send == 'true'
        uses: actions/checkout@v4
      - if: steps.due.outputs.send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.due.outputs.send == 'true'
        run: pip install -r requirements.txt
      - if: steps.due.outputs.send == 'true'
        run: python bot.py --once
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      - name: Remember which facts have been sent
        if: steps.due.outputs.send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Record sent sheep fact"
          git push
