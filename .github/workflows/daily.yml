name: Daily sheep fact

on:
  schedule:
    # GitHub schedules are in UTC, ignore daylight saving time and often start
    # late, so check a few times each morning. The bot sends on the first run
    # at or after 11am New York time and skips the rest.
    - cron: "7 15-19 * * *"
  # "Run workflow" button: always sends a fact, for testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      TIMEZONE: America/New_York
      SEND_TIME: "11:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ github.event_name == 'workflow_dispatch' && '--once' || '--daily' }}
      - name: Remember which facts have been sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Record sent sheep fact"
          git push
